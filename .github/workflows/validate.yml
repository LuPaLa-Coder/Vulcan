name: Vulcan Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-agents:
    name: Lint Agent Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontmatter YAML
        run: |
          for agent_file in Vulcan.*.agent.md; do
            echo "Validating $agent_file..."

            # Extract frontmatter
            frontmatter=$(sed -n '/^---$/,/^---$/p' "$agent_file")

            # Check required fields
            if ! echo "$frontmatter" | grep -q "^name:"; then
              echo "❌ $agent_file: missing 'name:' field"
              exit 1
            fi

            if ! echo "$frontmatter" | grep -q "^description:"; then
              echo "❌ $agent_file: missing 'description:' field"
              exit 1
            fi

            if ! echo "$frontmatter" | grep -q "^version:"; then
              echo "❌ $agent_file: missing 'version:' field"
              exit 1
            fi

            echo "✓ $agent_file OK"
          done

      - name: Check name uniqueness
        run: |
          names=$(grep "^name:" Vulcan.*.agent.md | cut -d' ' -f2- | sort)
          duplicates=$(echo "$names" | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "❌ Duplicate agent names: $duplicates"
            exit 1
          fi
          echo "✓ All agent names unique"

  link-check:
    name: Check Internal Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate markdown links
        run: |
          for file in Vulcan.*.agent.md README.md docs/*.md CHANGELOG.md; do
            [ -f "$file" ] || continue
            echo "Checking links in $file..."

            while IFS= read -r link; do
              [ -n "$link" ] || continue
              clean_link="${link%%#*}"
              if [[ "$clean_link" == http* ]]; then
                echo "  (external) $clean_link"
              elif [ ! -f "$(dirname "$file")/$clean_link" ]; then
                echo "❌ Broken link in $file: $clean_link"
                exit 1
              fi
            done < <(
              grep -oE '\[[^]]+\]\([^)]+\.md(#[^)]+)?\)' "$file" |
                sed -E 's/.*\(([^)]+)\)/\1/' || true
            )
          done
          echo "✓ All links valid"

  sync-check:
    name: Sync Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check agent file list consistency
        run: |
          echo "Checking install.sh vs Vulcan.*.agent.md files..."

          # Extract agent files from install.sh
          install_agents=$(awk '
            /^AGENT_FILES=\(/ { in_list=1; next }
            in_list && /^\)/ { exit }
            in_list && /\.agent\.md/ {
              gsub(/[ "]/, "")
              print
            }
          ' install.sh | sort)

          # Get actual agent files
          actual_agents=$(ls Vulcan.*.agent.md | sort)

          if [ "$install_agents" != "$actual_agents" ]; then
            echo "❌ install.sh AGENT_FILES out of sync"
            echo "Expected: $actual_agents"
            echo "Found: $install_agents"
            exit 1
          fi

          echo "✓ install.sh AGENT_FILES consistent"

      - name: Check README agent table
        run: |
          echo "Checking README agent table..."
          for agent_file in Vulcan.*.agent.md; do
            agent_name=$(sed -n 's/^name: //p' "$agent_file" | head -1)
            if ! grep -Fq "| **${agent_name}** |" README.md; then
              echo "❌ README agent table missing ${agent_name}"
              exit 1
            fi
          done
          echo "✓ README mentions all agents"

  size-budget:
    name: Agent Size Budget Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check agent sizes
        run: |
          echo "Checking agent file sizes..."
          max_lines=900
          max_size_bytes=45056

          for agent in Vulcan.*.agent.md; do
            lines=$(wc -l < "$agent")
            size_bytes=$(wc -c < "$agent")

            if [ "$lines" -gt "$max_lines" ]; then
              echo "❌ $agent: $lines lines (max: $max_lines)"
              exit 1
            fi

            if [ "$size_bytes" -gt "$max_size_bytes" ]; then
              echo "❌ $agent: ${size_bytes} bytes (max: ${max_size_bytes})"
              exit 1
            fi

            echo "✓ $agent: $lines lines, ${size_bytes} bytes"
          done

  contract-evals:
    name: Routing and Capability Contract Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run executable contract evals
        run: bash scripts/run-contract-evals.sh

  partials-drift:
    name: Shared Blocks Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rigenera dai partial e confronta
        run: |
          chmod +x scripts/sync-partials.sh
          ./scripts/sync-partials.sh
          if ! git diff --exit-code; then
            echo "❌ Un blocco condiviso è stato editato a mano invece che in partials/. Editare il file in partials/ e rilanciare scripts/sync-partials.sh."
            exit 1
          fi
          echo "✓ Nessun drift nei blocchi condivisi"
